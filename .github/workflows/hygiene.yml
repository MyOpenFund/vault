name: hygiene

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  commit-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No agent attribution in the commits of the change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            # New branch: only the pushed commit is checked.
            range="$AFTER^!"
          else
            range="$BEFORE..$AFTER"
          fi
          bash .github/scripts/check_attribution.sh "$range"
