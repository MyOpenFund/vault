name: release

# Actions -> release -> Run workflow (target `pypi`, package `query` or
# `contract`) builds the default branch, publishes once the `pypi` environment's
# required reviewer approves, then creates the tag `query-vX.Y.Z` /
# `contract-vX.Y.Z` and the GitHub Release itself. Target `testpypi` is a
# rehearsal: it publishes to TestPyPI and creates no tag. Pushing such a tag by
# hand still publishes. PyPI trusts this workflow + environment (no token).
on:
  push:
    tags: ["query-v*", "contract-v*"]
  workflow_dispatch:
    inputs:
      target:
        # The publish environment comes from this input, so a new option needs a workflow change.
        description: Index to publish to (testpypi is a rehearsal, no tag, no release)
        type: choice
        options: [pypi, testpypi]
        default: pypi
        required: true
      package:
        description: Package to build and publish
        type: choice
        options: [query, contract]
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}-${{ inputs.package || 'tag' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag || github.ref_name }}
      sha: ${{ github.sha }}
    steps:
      - name: Branch guard (a dispatch must run on master)
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/master" ]; then
            echo "run this workflow on master (got $REF): pick the master branch in Run workflow"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Resolve the package (tag prefix, or the dispatch input)
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            package="$INPUT_PACKAGE"
          else
            package="${REF_NAME%%-v*}"
          fi
          case "$package" in
            query | contract) ;;
            *) echo "unknown package '$package' (ref '$REF_NAME')"; exit 1 ;;
          esac
          {
            echo "PKG_DIR=$package"
            echo "PKG_IMPORT=vault_$package"
            echo "PKG_DIST=myopenfund-vault-$package"
          } >> "$GITHUB_ENV"
      - name: Build
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build "$PKG_DIR" --outdir dist
          twine check --strict dist/*
      - name: Smoke install in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/.github/scripts/smoke_wheel.py" "$PKG_IMPORT"
      - name: Tag check (the wheel version must equal the tag version)
        if: github.event_name == 'push'
        run: |
          wheel_version="$("$RUNNER_TEMP/smoke/bin/python" -c "import importlib.metadata as m; print(m.version('$PKG_DIST'))")"
          tag_version="${GITHUB_REF_NAME#"$PKG_DIR"-v}"
          if [ "$wheel_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME says $tag_version but the built $PKG_DIST wheel is $wheel_version"
            exit 1
          fi
          echo "tag and wheel agree: $wheel_version"
      - name: Branch check (the tagged commit must be on master)
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "tag $GITHUB_REF_NAME is not on master"; exit 1; }
      - name: Compute the tag from the wheel version (dispatch; must be new for pypi)
        id: tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          version="$("$RUNNER_TEMP/smoke/bin/python" -c "import importlib.metadata as m; print(m.version('$PKG_DIST'))")"
          tag="$PKG_DIR-v$version"
          if [ "$INPUT_TARGET" = "pypi" ]; then
            existing="$(git ls-remote --tags origin "refs/tags/$tag")"
            if [ -n "$existing" ]; then
              echo "tag $tag already exists on the remote: bump the version in a PR first"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "will release $tag from $GITHUB_SHA (target $INPUT_TARGET)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  github-release:
    # Never for a TestPyPI rehearsal. On dispatch this job creates the tag with the
    # job's token; GitHub does not start workflows for events caused by GITHUB_TOKEN,
    # so that tag push does not re-trigger this workflow (which is what we want).
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the tag (dispatch; safe to re-run)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          # A re-run after a partial failure finds the tag already there. At the built
          # commit: nothing to do. Anywhere else: stop, never move or reuse it.
          remote_sha="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk '{ if ($2 ~ /\^\{\}$/) p = $1; else t = $1 } END { print (p != "" ? p : t) }')"
          if [ -z "$remote_sha" ]; then
            git -c user.name="Marc Jeulin" -c user.email="${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com" tag -a "$TAG" -m "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          elif [ "$remote_sha" = "$SHA" ]; then
            echo "tag $TAG already exists at $SHA: nothing to push"
          else
            echo "tag $TAG already exists at $remote_sha, not at the built commit $SHA: refusing to reuse it"
            exit 1
          fi
      - name: Create the GitHub release (or complete it)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          # A release already exists when it was drafted in the GitHub web UI or when this
          # job is re-run: attach the distributions and keep the title and notes there.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
