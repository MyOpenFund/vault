name: release

# Tag `query-vX.Y.Z` publishes myopenfund-vault-query, `contract-vX.Y.Z`
# publishes myopenfund-vault-contract. The `publish` job runs in a GitHub
# environment (`pypi`, or `testpypi` for manual rehearsals) whose required
# reviewer must approve; PyPI trusts this workflow + environment (no token).
on:
  push:
    tags: ["query-v*", "contract-v*"]
  workflow_dispatch:
    inputs:
      target:
        # The publish environment comes from the event name (workflow_dispatch -> testpypi), so a new option needs a workflow change.
        description: Index to publish to (TestPyPI rehearsal only)
        type: choice
        options: [testpypi]
        required: true
      package:
        description: Package to build and publish
        type: choice
        options: [query, contract]
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}-${{ inputs.package || 'tag' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Resolve the package (tag prefix, or the dispatch input)
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            package="$INPUT_PACKAGE"
          else
            package="${REF_NAME%%-v*}"
          fi
          case "$package" in
            query | contract) ;;
            *) echo "unknown package '$package' (ref '$REF_NAME')"; exit 1 ;;
          esac
          {
            echo "PKG_DIR=$package"
            echo "PKG_IMPORT=vault_$package"
            echo "PKG_DIST=myopenfund-vault-$package"
          } >> "$GITHUB_ENV"
      - name: Build
        run: |
          pip install build==1.6.1 twine==6.2.0
          python -m build "$PKG_DIR" --outdir dist
          twine check --strict dist/*
      - name: Smoke install in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/.github/scripts/smoke_wheel.py" "$PKG_IMPORT"
      - name: Tag check (the wheel version must equal the tag version)
        if: github.event_name == 'push'
        run: |
          wheel_version="$("$RUNNER_TEMP/smoke/bin/python" -c "import importlib.metadata as m; print(m.version('$PKG_DIST'))")"
          tag_version="${GITHUB_REF_NAME#"$PKG_DIR"-v}"
          if [ "$wheel_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME says $tag_version but the built $PKG_DIST wheel is $wheel_version"
            exit 1
          fi
          echo "tag and wheel agree: $wheel_version"
      - name: Branch check (the tagged commit must be on master)
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "tag $GITHUB_REF_NAME is not on master"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  github-release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
