name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      # The integration fixture starts one postgres:16 container per module and
      # skips (rather than fails) when `docker run` times out, which is the
      # right fallback on a laptop but would hide a hung registry pull in CI.
      # Pull up front, retried, so a registry hiccup fails or heals here.
      - name: Pre-pull postgres:16
        env:
          PULL_ATTEMPTS: "3"           # tries before the job fails
          PULL_TIMEOUT_SECONDS: "300"  # per try; a hung pull is killed and retried
          PULL_BACKOFF_SECONDS: "15"   # wait after try n: n * this
        run: |
          for attempt in $(seq 1 "$PULL_ATTEMPTS"); do
            if timeout "$PULL_TIMEOUT_SECONDS" docker pull postgres:16; then exit 0; fi
            echo "docker pull postgres:16 failed (attempt $attempt/$PULL_ATTEMPTS)"
            if [ "$attempt" -lt "$PULL_ATTEMPTS" ]; then sleep $((attempt * PULL_BACKOFF_SECONDS)); fi
          done
          exit 1
      - name: Integration tests (throwaway Postgres via docker)
        run: python -m pytest tests/ -q -m integration

  # vault-contract declares requires-python >=3.10: data-orchestrator (>=3.10)
  # and company-corpus (>=3.11) import it at run time. Install the package
  # alone (no repo requirements) on the oldest supported Python and run its
  # own tests, which import nothing else from this repo, then the checker CLI
  # over the golden rows.
  contract-py310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install vault-contract (Python 3.10)
        run: pip install pytest==8.3.3 pytest-timeout==2.3.1 ./contract
      - name: Contract tests (Python 3.10)
        run: python -m pytest -q tests/test_contract_check.py tests/test_contract_fields.py tests/test_contract_package.py tests/test_contract_validate.py
      - name: Checker over the golden rows (Python 3.10)
        run: python .github/scripts/check_golden.py

  # Publication check on every PR and push: build each distribution, run
  # `twine check --strict`, install the wheel in a fresh venv away from the
  # checkout and import it (contract: also read a golden file from the wheel).
  # release.yml repeats this and adds the tag check and the upload.
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [query, contract]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build "${{ matrix.package }}" --outdir dist
          twine check --strict dist/*
      - name: Smoke install in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/.github/scripts/smoke_wheel.py" "vault_${{ matrix.package }}"
