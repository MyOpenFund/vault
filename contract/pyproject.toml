[build-system]
requires = ["setuptools>=77"]  # PEP 639 `license = "MIT"` (string form) needs setuptools 77+
build-backend = "setuptools.build_meta"

[project]
name = "vault-contract"
version = "1.0.0"  # = vault_contract.CONTRACT_VERSION (tests/test_contract_package.py)
description = "The MyOpenFund `documents` contract: manifest row fields, corpus vocabulary, validation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

# The golden reference rows are package data: producers test against them.
[tool.setuptools.package-data]
"vault_contract.golden" = ["*.json", "refused/*.json"]
