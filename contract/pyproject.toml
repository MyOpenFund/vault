[build-system]
requires = ["setuptools>=77"]  # PEP 639 `license = "MIT"` (string form) needs setuptools 77+
build-backend = "setuptools.build_meta"

[project]
name = "myopenfund-vault-contract"
version = "1.1.0"  # = vault_contract.CONTRACT_VERSION (tests/test_contract_package.py)
description = "The MyOpenFund `documents` contract: manifest row fields, corpus vocabulary, validation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
authors = [{ name = "Marc Jeulin" }]
maintainers = [{ name = "Marc Jeulin" }]
keywords = ["myopenfund", "vault", "contract"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/MyOpenFund/vault"
Source = "https://github.com/MyOpenFund/vault"
Issues = "https://github.com/MyOpenFund/vault/issues"
Organization = "https://github.com/MyOpenFund"

[tool.setuptools.packages.find]
where = ["src"]

# The golden reference rows are package data: producers test against them.
[tool.setuptools.package-data]
"vault_contract.golden" = ["*.jsonl", "*.json"]
