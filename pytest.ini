[pytest]
markers =
    integration: requires docker (throwaway postgres container)
addopts = -m "not integration"
# Backstop for the concurrency tests: a thread that wedges holding a Postgres
# connection would otherwise hang the run (and CI) forever. Per test, and
# generous — the first integration test in a module also pays for its
# throwaway container's startup (pre-pull postgres:16 to keep that short).
timeout = 300
