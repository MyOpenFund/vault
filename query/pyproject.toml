[build-system]
requires = ["setuptools>=77"]  # PEP 639 `license = "MIT"` (string form) needs setuptools 77+
build-backend = "setuptools.build_meta"

[project]
name = "vault-query"
version = "0.2.0"
description = "Read-only queries over the MyOpenFund vault: documents, corpus stats, run health."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["psycopg2-binary>=2.9.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]
